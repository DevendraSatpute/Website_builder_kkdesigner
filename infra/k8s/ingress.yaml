# Public edge. On GKE use Ingress + BackendConfig; on EKS use ALB Ingress Controller.
# Only these paths need to be public:
#   /           website
#   /admin      SPA admin UI (passcode is NOT a network ACL — still protect in prod)
#   /api/enquiry   POST public
#   /api/enquiries GET public but requires X-Admin-Key
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kkdesigners
  namespace: kkdesigners
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  rules:
    - host: kkdesigners.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
