apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kkdesigners
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: REGION-docker.pkg.dev/PROJECT/kkdesigners/web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kkdesigners
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
