apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kkdesigners
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT/kkdesigners/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: kk-api
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kkdesigners
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
